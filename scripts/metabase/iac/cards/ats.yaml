  - key: Q-ATS-05
    name: ATS per Kelompok Usia
    tab: ats
    collection: Dashboard Publik — Kartu
    display: bar
    description: 'Jumlah ATS dikelompokkan menurut rentang usia sekolah: 7–12 (SD), 13–15 (SMP), dan 16–18 (SMA).'
    layout: {row: 12, col: 0, w: 12, h: 8}
    filters:
      - {tag: desa, parameter: p-desa, label: Desa, field: {schema: dbo, table: ats, column: desa_kelurahan}}
      - {tag: jenjang, parameter: p-jenjang-ats, label: Jenjang, field: {schema: dbo, table: ats, column: jenjang_pendidikan}}
      - {tag: kecamatan, parameter: p-kecamatan, label: Kecamatan, field: {schema: dbo, table: ats, column: kecamatan}}
      - {tag: semester_ats, parameter: p-semester-ats, label: Semester (ATS), field: {schema: dbo, table: ats, column: semester_id}}
    expect:
      rows: 3
    visualization_settings:
      graph.dimensions:
        - kelompok_usia
      graph.colors:
        - '#082A4F'
        - '#F2A03D'
        - '#7D6AA8'
        - '#4CAF93'
      graph.metrics:
        - jumlah_ats
    sql: |-
      WITH ats_dim AS (
        SELECT
          dbo.ats.ats_id,
          dbo.ats.semester_id,
          TRIM(dbo.ats.status) AS status,
          dbo.ats.usia,
          dbo.ats.kecamatan,
          dbo.ats.desa_kelurahan AS desa,
          COALESCE(NULLIF(dbo.ats.jenjang_pendidikan, ''), 'Tidak terdata') AS jenjang,
          dbo.ats.tahun
        FROM dbo.ats
        WHERE dbo.ats.soft_delete = 0
          AND dbo.ats.usia BETWEEN 7 AND 18
          AND dbo.ats.kode_kabupaten = '220800'
        [[AND {{kecamatan}}]]
        [[AND {{desa}}]]
        [[AND {{jenjang}}]]
        [[AND {{semester_ats}}]]
      )
      SELECT CASE
               WHEN usia BETWEEN 7 AND 12 THEN '7-12 (SD)'
               WHEN usia BETWEEN 13 AND 15 THEN '13-15 (SMP)'
               ELSE '16-18 (SMA)'
             END AS kelompok_usia,
             COUNT(*) AS jumlah_ats
      FROM ats_dim
      GROUP BY 1
      ORDER BY 1
