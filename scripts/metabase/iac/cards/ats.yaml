    collection: Dashboard Publik — Kartu
    display: pie
    description: 'Sebaran ATS menurut status: BPB (belum pernah bersekolah), LTM (lulus tidak melanjutkan), dan DO (drop out). Nilai dinormalisasi dengan `TRIM()` karena basis data menyimpan dua varian (''DO'' dan ''DO '').'
    layout: {row: 4, col: 0, w: 8, h: 8}
    filters:
      - {tag: desa, parameter: p-desa, label: Desa, field: {schema: dbo, table: ats, column: desa_kelurahan}}
      - {tag: jenjang, parameter: p-jenjang-ats, label: Jenjang, field: {schema: dbo, table: ats, column: jenjang_pendidikan}}
