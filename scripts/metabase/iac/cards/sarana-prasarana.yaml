    collection: Dashboard Publik — Kartu
    display: row
    description: Hanya terisi pada semester 2026/2027.
    layout: {row: 8, col: 12, w: 12, h: 8}
    filters:
      - {tag: desa, parameter: p-desa, label: Desa, field: {schema: dbo, table: sekolah, column: desa_kelurahan}}
      - {tag: jenjang, parameter: p-jenjang, label: Jenjang, field: {schema: ref, table: bentuk_pendidikan, column: nama}}
      - {tag: kecamatan, parameter: p-kecamatan, label: Kecamatan, field: {schema: ref, table: mst_wilayah, column: nama}}
      - {tag: semester_ruang, parameter: p-semester, label: Semester, field: {schema: dbo, table: ruang_longitudinal, column: semester_id}}
      - {tag: status_sekolah, parameter: p-status, label: Status Sekolah, field: {schema: dbo, table: sekolah, column: status_sekolah}}
    expect:
      rows: 8
    visualization_settings:
      graph.dimensions:
