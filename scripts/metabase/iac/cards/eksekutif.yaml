        LEFT JOIN ref.status_kepemilikan
          ON ref.status_kepemilikan.status_kepemilikan_id = dbo.sekolah.status_kepemilikan_id
        WHERE dbo.sekolah.keaktifan = 1
          AND dbo.sekolah."Soft_delete" = 0
        [[AND {{kecamatan}}]]
        [[AND {{desa}}]]
        [[AND {{jenjang}}]]
        [[AND {{status_sekolah}}]]
      ),
      pd_dim AS (
