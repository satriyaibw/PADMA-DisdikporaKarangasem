    name: Sebaran Akreditasi Sekolah
    tab: sekolah
    collection: Dashboard Publik — Kartu
    display: pie
    description: Akreditasi terakhir tiap sekolah (A, B, C, Terakreditasi, atau Belum terdata), diambil dari `dbo.akreditasi_sp` dengan `tanggal_sk` terbaru per sekolah.
    layout: {row: 8, col: 0, w: 8, h: 8}
    filters:
