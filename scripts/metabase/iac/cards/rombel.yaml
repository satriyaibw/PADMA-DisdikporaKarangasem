          dbo.rombongan_belajar.tingkat_pendidikan_id,
          dbo.rombongan_belajar.nama AS nama_rombel,
          dbo.rombongan_belajar.ptk_id AS wali_kelas_id,
          sekolah_dim.sekolah_id,
          sekolah_dim.npsn,
