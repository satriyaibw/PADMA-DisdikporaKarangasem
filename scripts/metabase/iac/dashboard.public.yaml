#
# Sumber kebenaran dashboard publik Disdikpora Karangasem. Semua rujukan
# memakai NAMA (database, collection, kartu) dan {schema, table, column},
# bukan id numerik Metabase, supaya bisa diterapkan di instance lain.
#
# Menerapkan: python3 tools/apply.py --dry-run  lalu  python3 tools/apply.py

dashboard:
  database: backbone_client
  name: Public
  description: Dashboard publik untuk data pendidikan agregat
  width: fixed
  auto_apply_filters: true
  public_link: true
tabs:
  - key: eksekutif
    name: Eksekutif
  - key: sekolah
    name: Sekolah
  - key: rombel
    name: Rombel
  - key: peserta-didik
    name: Peserta Didik
  - key: ats
    name: ATS
  - key: sarana-prasarana
    name: Sarana Prasarana
parameters:
  - key: p-kecamatan
    name: Kecamatan
    slug: kecamatan
    type: string/=
    multi: true
    values:
      from_card: filter-kecamatan
      value_field: kecamatan
  - key: p-desa
    name: Desa/Kelurahan
    slug: desa
    type: string/=
    multi: true
    values:
      from_card: filter-desa
      value_field: desa
  - key: p-jenjang
    name: Jenjang Satuan Pendidikan
    slug: jenjang
    type: string/=
    multi: true
    values:
      from_card: filter-jenjang
      value_field: jenjang
  - key: p-status
    name: Status Sekolah
    slug: status_sekolah
    type: number/=
    multi: true
    values:
      static_list:
        - [1, Negeri]
        - [2, Swasta]
  - key: p-jenis-ptk
    name: Jenis PTK
    slug: jenis_ptk
    type: string/=
    multi: true
    values:
      from_card: filter-jenis-ptk
      value_field: jenis_ptk
  - key: p-jabatan-ptk
    name: Jabatan PTK
